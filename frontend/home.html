<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — ReSolve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/search.css">
  <link rel="stylesheet" href="/assets/css/home.css">
</head>
<body>
  <div class="app-shell">
    <aside class="navbar" id="navbar"></aside>

    <div class="app-main">
      <div class="page-body home-body">
        <form class="home-search" id="search-form" autocomplete="off">
          <div class="sheet-select" id="sheet-select" data-open="false">
            <button class="sheet-trigger" id="sheet-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false">
              <span class="sheet-trigger-label">All problems</span>
              <svg class="sheet-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div class="sheet-menu" id="sheet-menu" role="listbox" hidden></div>
          </div>

          <div class="search-input-wrap">
            <input class="input" id="problem-input" type="text" spellcheck="false"
                   placeholder="Search…" aria-label="Search problems in the selected sheet">
            <div class="suggestions" id="suggestions" data-open="false" role="listbox"></div>
          </div>

          <button class="btn" id="load-button" type="submit">Search</button>
        </form>

        <h1 class="home-welcome" id="home-welcome"></h1>

        <p id="page-alert" class="alert hidden" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/js/pages/home.js"></script>
</body>
</html>
