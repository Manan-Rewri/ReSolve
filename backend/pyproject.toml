[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Dependencies are pinned in requirements.txt on purpose: a hackathon needs
# `pip install -r requirements.txt` to just work, not a build backend.
