<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — ReSolve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="auth-card">
      <a class="auth-brand" href="/">ReSolve<span>.</span></a>

      <div class="auth-head">
        <h1 id="auth-heading">Create your account</h1>
        <p id="auth-subheading" class="small muted">Start tracking what you solve and what you forget.</p>
      </div>

      <p id="form-alert" class="alert hidden" role="status" aria-live="polite"></p>

      <form id="auth-form" class="auth-form" novalidate>
        <div class="field">
          <label class="label" for="full-name">Full name</label>
          <input class="input" id="full-name" name="full_name" type="text" autocomplete="name" placeholder="Optional">
        </div>

        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="password-field">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
            <button class="password-toggle" id="password-toggle" type="button">Show</button>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="submit" type="submit">
          <span id="auth-submit-label">Create account</span>
        </button>
      </form>

      <p class="auth-foot" id="auth-switch"></p>
    </div>
  </main>

  <script type="module" src="/assets/js/pages/register.js"></script>
</body>
</html>
